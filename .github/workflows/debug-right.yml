# Отладочная правая половина: подробный журнал через USB, заряд левой половины и zmk.elf для расшифровки адреса сбоя.
# Нажатия в журнале есть — скрипт macos/likeeb-debug-log.sh вырезает их до записи в файл.
name: Debug right half
on:
  push:
    paths:
      - ".github/workflows/debug-right.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: West init and update
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build
        run: >
          west build -s zmk/app -d build -b seeeduino_xiao_ble -S zmk-usb-logging --
          -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD=likeeb_right
          -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
      - uses: actions/upload-artifact@v4
        with:
          name: debug-right
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/zmk.elf
